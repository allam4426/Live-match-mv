openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FootballLive API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: banners
  - name: trophies
    description: Ad banner operations
  - name: matches
    description: Match operations
  - name: teams
    description: Team operations
  - name: streams
    description: Stream operations
  - name: highlights
    description: Highlight operations
  - name: stats
    description: Stats and summary operations
  - name: tournaments
    description: Tournament operations
  - name: events
    description: Match event operations
  - name: lineup
    description: Match lineup operations
  - name: admin
    description: Admin auth operations

paths:
  /spotlights:
    get:
      operationId: listSpotlights
      tags: [spotlights]
      summary: List all spotlights
      responses:
        "200":
          description: List of spotlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Spotlight"
    post:
      operationId: createSpotlight
      tags: [spotlights]
      summary: Create a spotlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotlightInput"
      responses:
        "201":
          description: Created spotlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spotlight"
  /spotlights/{id}:
    patch:
      operationId: updateSpotlight
      tags: [spotlights]
      summary: Update a spotlight
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotlightInput"
      responses:
        "200":
          description: Updated spotlight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spotlight"
    delete:
      operationId: deleteSpotlight
      tags: [spotlights]
      summary: Delete a spotlight
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trophies:
    get:
      operationId: listTrophies
      tags: [trophies]
      summary: List trophies
      parameters:
        - in: query
          name: teamId
          schema:
            type: integer
      responses:
        "200":
          description: List of trophies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trophy"
    post:
      operationId: createTrophy
      tags: [trophies]
      summary: Create a trophy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrophyInput"
      responses:
        "201":
          description: Created trophy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trophy"
  /trophies/{id}:
    patch:
      operationId: updateTrophy
      tags: [trophies]
      summary: Update a trophy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrophyInput"
      responses:
        "200":
          description: Updated trophy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trophy"
    delete:
      operationId: deleteTrophy
      tags: [trophies]
      summary: Delete a trophy
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /banners:
    get:
      operationId: listBanners
      tags: [banners]
      summary: List banners
      parameters:
        - in: query
          name: position
          schema:
            type: string
            enum: [top_home, top_live]
      responses:
        "200":
          description: List of banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
    post:
      operationId: createBanner
      tags: [banners]
      summary: Create a banner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "201":
          description: Created banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
  /banners/{id}:
    patch:
      operationId: updateBanner
      tags: [banners]
      summary: Update a banner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
    delete:
      operationId: deleteBanner
      tags: [banners]
      summary: Delete a banner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get admin auth status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthStatus"

  /admin/staff:
    get:
      operationId: listAdminStaff
      tags: [admin]
      summary: List all staff accounts
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminStaff"
    post:
      operationId: createAdminStaff
      tags: [admin]
      summary: Create a staff account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffInput"
      responses:
        "201":
          description: Staff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaff"

  /admin/staff/{id}:
    delete:
      operationId: deleteAdminStaff
      tags: [admin]
      summary: Delete a staff account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams/{id}/form:
    get:
      operationId: getTeamForm
      tags: [teams]
      summary: Get last 5 match results for a team (across all competitions)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team form guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamForm"
        "404":
          description: Team not found

  /teams/{id}/squad:
    get:
      operationId: getTeamSquad
      tags: [teams]
      summary: Get a team's squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Squad list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SquadPlayer"
    post:
      operationId: addSquadPlayer
      tags: [teams]
      summary: Add a player to a team's squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquadPlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadPlayer"

  /teams/{id}/squad/{playerId}:
    patch:
      operationId: updateSquadPlayer
      tags: [teams]
      summary: Update a squad player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SquadPlayerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadPlayer"
    delete:
      operationId: removeSquadPlayer
      tags: [teams]
      summary: Remove a player from squad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /squad/{playerId}:
    get:
      operationId: getSquadPlayer
      tags: [teams]
      summary: Get a single squad player by ID
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SquadPlayer"

  /squad/{playerId}/stats:
    get:
      operationId: getSquadPlayerStats
      tags: [teams]
      summary: Get career stats for a squad player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"

  /players:
    get:
      operationId: listPlayers
      tags: [teams]
      summary: List all players across all teams
      parameters:
        - in: query
          name: sport
          schema:
            type: string
        - in: query
          name: teamId
          schema:
            type: integer
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: List of players with team info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerListItem"

  /matches/{id}/lineup/auto:
    post:
      operationId: autoFillLineup
      tags: [lineup]
      summary: Auto-fill match lineup from both teams' squads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup auto-filled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLineup"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Tournaments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Update a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/active:
    get:
      operationId: listActiveTournaments
      tags: [tournaments]
      summary: List tournaments with match activity status
      parameters:
        - name: sport
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Active tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentWithStatus"

  /tournaments/{id}/matches:
    get:
      operationId: getTournamentMatches
      tags: [tournaments]
      summary: Get all matches for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /tournaments/{id}/standings:
    get:
      operationId: getTournamentStandings
      tags: [tournaments]
      summary: Get tournament standings (grouped by group for group-stage format)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStandings"

  /tournaments/{id}/top-scorers:
    get:
      operationId: getTournamentTopScorers
      tags: [tournaments]
      summary: Get top scorers and MVP for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Top scorers and MVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentTopScorers"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [live, scheduled, finished, all]
        - name: competition
          in: query
          schema:
            type: string
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
        - name: tournamentId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a new match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/live:
    get:
      operationId: listLiveMatches
      tags: [matches]
      summary: List currently live matches
      parameters:
        - name: sport
          in: query
          schema:
            type: string
            enum: [football, futsal, all]
      responses:
        "200":
          description: Live matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a single match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches/{id}/events:
    get:
      operationId: listMatchEvents
      tags: [events]
      summary: Get all events for a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"
    post:
      operationId: createMatchEvent
      tags: [events]
      summary: Add a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"

  /matches/{id}/events/{eventId}:
    patch:
      operationId: updateMatchEvent
      tags: [events]
      summary: Update a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"
    delete:
      operationId: deleteMatchEvent
      tags: [events]
      summary: Delete a match event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /matches/{id}/lineup:
    get:
      operationId: getMatchLineup
      tags: [lineup]
      summary: Get match lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchLineup"
    post:
      operationId: addLineupPlayer
      tags: [lineup]
      summary: Add a player to the lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupPlayerInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupPlayer"

  /matches/{id}/lineup/{playerId}:
    patch:
      operationId: updateLineupPlayer
      tags: [lineup]
      summary: Update a lineup player's role or isStarting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupPlayerPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupPlayer"
    delete:
      operationId: removeLineupPlayer
      tags: [lineup]
      summary: Remove a player from lineup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /streams:
    get:
      operationId: listStreams
      tags: [streams]
      summary: List available streams
      parameters:
        - name: matchId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Streams list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stream"
    post:
      operationId: createStream
      tags: [streams]
      summary: Create a stream link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"

  /streams/{id}:
    delete:
      operationId: deleteStream
      tags: [streams]
      summary: Delete a stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /highlights:
    get:
      operationId: listHighlights
      tags: [highlights]
      summary: List all highlights
      parameters:
        - name: competition
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Highlights list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Highlight"
    post:
      operationId: createHighlight
      tags: [highlights]
      summary: Create a highlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"

  /highlights/{id}:
    get:
      operationId: getHighlight
      tags: [highlights]
      summary: Get a single highlight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Highlight found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Highlight"
    delete:
      operationId: deleteHighlight
      tags: [highlights]
      summary: Delete a highlight
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get dashboard stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/competitions:
    get:
      operationId: listCompetitions
      tags: [stats]
      summary: List active competitions
      responses:
        "200":
          description: Competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionStat"

components:
